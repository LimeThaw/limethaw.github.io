<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href` (here /ethimo/). -->
  <base href="/ethimo/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ethimo, a calm habit tracker.">
  <meta name="theme-color" content="#3b6939">

  <!-- Home Screen install (iOS Safari and Android) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ethimo">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Ethimo</title>

  <!-- Moss splash while Flutter loads; flutter_bootstrap.js removes it after the first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #3b6939; }
    #splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #3b6939;
      transition: opacity 250ms ease-out;
    }
    #splash.hide { opacity: 0; }
    #splash svg { width: 96px; height: 96px; }
    @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
  </style>
</head>
<body>
  <div id="splash" role="img" aria-label="Ethimo">
    <svg viewBox="0 0 96 96" fill="#f7fbf1" aria-hidden="true">
      <path d="M72.5 27.5A32 32 0 1 0 72.5 68.5A25 25 0 1 1 72.5 27.5Z"/>
      <path d="M30.0 52.0C39.6 35.9 63.5 31.5 82.0 38.0C70.2 46.1 47.2 53.6 30.0 52.0Z"/>
    </svg>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
